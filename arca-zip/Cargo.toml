[package]
name = "arca-zip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Lector y escritor ZIP en safe Rust, con DEFLATE sobre zlib-rs"

[dependencies]
# Cifrado AES-256 de WinZip. Todo RustCrypto, safe Rust puro: es la pieza mas
# delicada del proyecto y no va a ser la que traiga un fallo de memoria.
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
sha1 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
getrandom = "0.2"
arca-core.workspace = true
flate2.workspace = true
crc32fast.workspace = true
# Zstandard: bindings a libzstd. Es el unico codigo C del crate y entra solo
# con la bandera codecs-native (seccion 03 del diseno).
zstd = { workspace = true, optional = true }

[features]
default = ["codecs-native"]
codecs-native = ["dep:zstd"]

[lints.rust]
unsafe_code = "forbid"
