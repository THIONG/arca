[package]
name = "arca-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Interfaz grafica de Arca"

[[bin]]
name = "arca-gui"
path = "src/main.rs"

[dependencies]
arca-core.workspace = true
arca-zip.workspace = true
arca-tar.workspace = true
arca-icons.workspace = true
rayon.workspace = true

# egui in pure Rust. wgpu is dropped on purpose: glow starts sooner and does
# not drag in the Vulkan/DX12 runtime, which adds nothing to listing a zip.
#
# default-features = false also dropped accesskit, which is what exposes the
# window to Narrator and NVDA. Turning it off was not a decision, it was a side
# effect, and it left the window unreadable to a screen reader.
#
# x11 and wayland are already reaching winit through glutin-winit's own
# defaults, so they are not a fix; naming them here stops that from being an
# accident that a dependency could take away without anyone noticing.
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
    "x11",
    "wayland",
] }

# Dialogos de fichero nativos. Es lo unico que toca la plataforma.
rfd = "0.15"
flate2.workspace = true
# La feature `image` trae el cargador que egui usa para dibujar una imagen
# desde bytes en memoria, que es lo que el visor tiene: una entrada sacada del
# archivo y nunca escrita en disco. Los formatos se eligen en el propio crate
# `image`, mas abajo.
egui_extras = { version = "0.29", features = ["image"] }

# Solo los formatos que alguien mete en un zip y espera poder mirar. Sin las
# features por defecto: son una docena de decodificadores y cada uno es peso en
# el binario y superficie que mantener.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "webp",
] }
sys-locale = "0.3"

# SHA-256 para comprobar lo que se baja antes de ejecutarlo. RustCrypto, safe
# Rust puro, la misma familia que el sha1 del cifrado de arca-zip.
sha2 = "0.10"

# CF_HDROP on the system clipboard, so Ctrl+C here pastes files in the
# Explorer. A thin wrapper over the four clipboard calls Win32 has; taking the
# `windows` crate for it would pull a far larger dependency in for the same
# work, and writing it by hand would mean unsafe in a crate that forbids it.
[target."cfg(windows)".dependencies]
clipboard-win = "5"

[target."cfg(windows)".build-dependencies]
winresource = "0.1"

# Arrastrar entradas fuera de la ventana. Solo-Windows, y en su propio crate
# porque es COM y unsafe, que aqui no se admite.
[target."cfg(windows)".dependencies.arca-drag]
path = "../arca-drag"

# Preguntar si hay una version nueva. En todas las plataformas: fuera de
# Windows el crate compila vacio y contesta que no, que es lo mismo que
# contesta una maquina sin red.
[dependencies.arca-net]
path = "../arca-net"
