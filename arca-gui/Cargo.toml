[package]
name = "arca-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Interfaz grafica de Arca"

[features]
default = []
# The production egui binary remains the default. GPUI is an opt-in shell built
# on the GPUI Kit release train, which is versioned on crates.io and locked by
# Cargo.lock rather than by a zed git rev.
# Feature-specific MSRV: Rust 1.97.1 (the package default remains 1.75).
gpui = [
    "dep:gpui",
    "dep:gpui_platform",
    "dep:gpui-component",
    "dep:gpui-kit-assets",
]

[[bin]]
name = "arca-gui"
path = "src/main.rs"

[dependencies]
arca-core.workspace = true
arca-zip.workspace = true
arca-tar.workspace = true
arca-icons.workspace = true
rayon.workspace = true

# egui in pure Rust. wgpu is dropped on purpose: glow starts sooner and does
# not drag in the Vulkan/DX12 runtime, which adds nothing to listing a zip.
#
# default-features = false also dropped accesskit, which is what exposes the
# window to Narrator and NVDA. Turning it off was not a decision, it was a side
# effect, and it left the window unreadable to a screen reader.
#
# x11 and wayland are already reaching winit through glutin-winit's own
# defaults, so they are not a fix; naming them here stops that from being an
# accident that a dependency could take away without anyone noticing.
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
    "x11",
    "wayland",
] }

# Dialogos de fichero nativos. Es lo unico que toca la plataforma.
rfd = "0.15"
flate2.workspace = true
# La feature `image` trae el cargador que egui usa para dibujar una imagen
# desde bytes en memoria, que es lo que el visor tiene: una entrada sacada del
# archivo y nunca escrita en disco. Los formatos se eligen en el propio crate
# `image`, mas abajo.
egui_extras = { version = "0.29", features = ["image"] }

# Solo los formatos que alguien mete en un zip y espera poder mirar. Sin las
# features por defecto: son una docena de decodificadores y cada uno es peso en
# el binario y superficie que mantener.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "webp",
] }
sys-locale = "0.3"

# GPUI comes from the GPUI Kit release train (`gpui-pre*`), not from a zed git
# rev. gpui-component is built against `gpui-pre ^0.3`, and a git pin here would
# put two copies of gpui in the graph, which does not link. Renaming the
# packages back to `gpui` / `gpui_platform` keeps every `use gpui::...` intact.
gpui = { package = "gpui-pre", version = "0.3", default-features = false, optional = true }
gpui-component = { version = "0.6", optional = true }
# The icon set gpui-component's `IconName` resolves against. It is already in
# the tree as a gpui-component dependency; naming it here is what lets
# `application()` be handed the asset source.
gpui-kit-assets = { version = "0.6", optional = true }

# CF_HDROP on the system clipboard, so Ctrl+C here pastes files in the
# Explorer. A thin wrapper over the four clipboard calls Win32 has; taking the
# `windows` crate for it would pull a far larger dependency in for the same
# work, and writing it by hand would mean unsafe in a crate that forbids it.
[target."cfg(windows)".dependencies]
clipboard-win = "5"

[target."cfg(windows)".dependencies.gpui_platform]
package = "gpui-pre-platform"
version = "0.3"
optional = true

[target.'cfg(target_os = "linux")'.dependencies.gpui_platform]
package = "gpui-pre-platform"
version = "0.3"
features = ["wayland", "x11"]
optional = true

[target.'cfg(target_os = "macos")'.dependencies.gpui_platform]
package = "gpui-pre-platform"
version = "0.3"
features = ["font-kit"]
optional = true

[target."cfg(windows)".build-dependencies]
winresource = "0.1"

# Arrastrar entradas fuera de la ventana. Solo-Windows, y en su propio crate
# porque es COM y unsafe, que aqui no se admite.
[target."cfg(windows)".dependencies.arca-drag]
path = "../arca-drag"
