[package]
name = "arca-shell"
version = "0.1.0"
edition = "2021"
description = "Windows Explorer context menu extension for Arca"
license = "Apache-2.0"

[lib]
# The DLL Explorer loads.
crate-type = ["cdylib"]

[dependencies]
# Pinned on purpose: the `#[implement]` API and the trait signatures change
# between minor versions of this crate. Before raising the version, check the
# IExplorerCommand_Impl signatures first.
windows = { version = "0.58", features = [
    # Without this the IExplorerCommand_Impl traits and friends do not exist:
    # they live in an impl.rs the crate includes behind
    # #[cfg(feature = "implement")]. It is what implementing a COM interface
    # needs, as opposed to only calling one.
    "implement",
    "Win32_Foundation",
    # IContextMenu, the classic menu, drags in STGMEDIUM, which in turn asks for
    # Gdi and StructuredStorage because of its union, plus Ole for CF_HDROP and
    # ReleaseStgMedium, and Registry for the IShellExtInit::Initialize signature.
    "Win32_Graphics_Gdi",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.58"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
