name: Release

# Se dispara al empujar una etiqueta vX.Y.Z. Tambien a mano, para ensayar
# el proceso sin publicar nada de verdad.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binarios:
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            nativo: true
          - nombre: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            nativo: true
          # El binario Intel se compila cruzado desde el runner ARM. Con
          # `macos-13`, el ultimo Intel que queda, un trabajo se pasaba 40
          # minutos esperando runner: GitHub lo esta retirando y hay cola.
          # El precio es que aqui no se puede comprobar que arranque, porque
          # el runner ARM no ejecuta un binario x86_64.
          - nombre: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            nativo: false
          - nombre: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            nativo: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Un binario que no pasa las pruebas no se publica. La etiqueta puede
      # apuntar a un commit que CI nunca vio.
      - name: Pruebas
        run: cargo test --workspace

      - name: Compilar
        run: cargo build --release --target ${{ matrix.target }}

      - name: Comprobar que el binario arranca
        if: matrix.nativo
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN="target/${{ matrix.target }}/release/arca.exe"
            test -f "target/${{ matrix.target }}/release/arca-gui.exe"
          else
            BIN="target/${{ matrix.target }}/release/arca"
            test -f "target/${{ matrix.target }}/release/arca-gui"
          fi
          "$BIN" --version
          "$BIN" --help > /dev/null

      - name: Empaquetar
        shell: bash
        run: |
          set -eu
          NOMBRE="arca-${{ github.ref_name }}-${{ matrix.nombre }}"
          mkdir -p "dist/$NOMBRE"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/arca.exe" "dist/$NOMBRE/"
            cp "target/${{ matrix.target }}/release/arca-gui.exe" "dist/$NOMBRE/"
          else
            cp "target/${{ matrix.target }}/release/arca" "dist/$NOMBRE/"
            cp "target/${{ matrix.target }}/release/arca-gui" "dist/$NOMBRE/"
          fi
          cp README.md LICENSE "dist/$NOMBRE/"
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a -tzip "$NOMBRE.zip" "$NOMBRE" > /dev/null
            ARCHIVO="$NOMBRE.zip"
          else
            tar czf "$NOMBRE.tar.gz" "$NOMBRE"
            ARCHIVO="$NOMBRE.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$ARCHIVO" > "$ARCHIVO.sha256"
          else
            shasum -a 256 "$ARCHIVO" > "$ARCHIVO.sha256"
          fi
          cat "$ARCHIVO.sha256"

      # Only on Windows: a real setup.exe, with its uninstaller in Installed
      # apps. The zip above is just loose binaries and installs no menus.
      - name: Instalador de Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          # arca-shell is excluded from the workspace, so --manifest-path
          # builds it into its own target directory and not the root one.
          # Pointing the installer at the root target is what broke v0.3.0.
          cargo build --release --target ${{ matrix.target }} \
            --manifest-path windows/arca-shell/Cargo.toml
          DLL="windows/arca-shell/target/${{ matrix.target }}/release/arca_shell.dll"
          test -f "$DLL" || { echo "the shell extension is not at $DLL"; exit 1; }
          mkdir -p windows/assets
          # Inno Setup ships with the windows runner image, but not being able
          # to build the installer is not something to discover in a release.
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then
            choco install innosetup -y --no-progress
          fi
          "$ISCC" \
            //DVersion=$VERSION \
            "//DBinDir=..\\target\\${{ matrix.target }}\\release" \
            "//DShellDir=arca-shell\\target\\${{ matrix.target }}\\release" \
            windows/arca.iss
          ls -la dist
          ARCHIVO=$(ls dist/arca-setup-*.exe)
          sha256sum "$ARCHIVO" | sed 's#dist/##' >> "dist/$(basename "$ARCHIVO").sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.sha256
          retention-days: 7

  publicar:
    name: Publicar el Release
    needs: binarios
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      # Si la etiqueta y la version del workspace no coinciden, el Release
      # saldria mintiendo sobre lo que contiene.
      - name: La etiqueta debe coincidir con la version del workspace
        run: |
          ETIQUETA="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "etiqueta=$ETIQUETA  Cargo.toml=$VERSION"
          test "$ETIQUETA" = "$VERSION"

      - uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Reunir los ficheros y las sumas
        run: |
          mkdir -p publicar
          find artefactos -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.exe' \) -exec cp {} publicar/ \;
          cat artefactos/*/*.sha256 | sed 's#.*/##' > publicar/SHA256SUMS.txt
          ls -la publicar
          cat publicar/SHA256SUMS.txt

      # Con `gh`, que ya viene en el runner y usa el token del propio flujo:
      # una accion de terceros menos en la cadena de suministro de un proyecto
      # que se define por no fiarse de lo que le llega.
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notas.md <<'FIN'
          ## Binarios

          Descomprime y coloca `arca` en el PATH. Comprueba la descarga con
          `SHA256SUMS.txt`:

          ```sh
          sha256sum -c SHA256SUMS.txt --ignore-missing
          ```

          ## Windows

          Use the installer, `arca-setup-*.exe`. It puts Arca in Installed apps
          with its own uninstaller, adds both Explorer context menus, the file
          associations and the PATH entry. The .zip is just the loose binaries
          and integrates with nothing.

          ## Not signed

          These binaries carry no code signature. Windows will show a
          SmartScreen warning and macOS a Gatekeeper one; on macOS clear it
          with `xattr -d com.apple.quarantine arca`. Signing needs a paid
          certificate and is on the pending list.

          The modern Windows 11 menu also needs Developer Mode, because it is
          registered as an unsigned sparse MSIX package. Without it the classic
          menu, under "Show more options", still works.
          FIN
          gh release create "$GITHUB_REF_NAME" \
            --title "Arca $GITHUB_REF_NAME" \
            --notes-file notas.md \
            publicar/*
