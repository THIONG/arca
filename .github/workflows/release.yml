name: Release

# Fires on pushing a vX.Y.Z tag. Also by hand, to rehearse the process without
# publishing anything for real.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            native: true
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            native: true
          # The Intel binary is cross-compiled from the ARM runner. With
          # `macos-13`, the last Intel one left, a job spent 40 minutes waiting
          # for a runner: GitHub is retiring them and there is a queue. The
          # price is that its startup cannot be checked here, because an ARM
          # runner will not execute an x86_64 binary.
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            native: false
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            native: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # A binary that does not pass the tests does not get published. The tag
      # can point at a commit CI never saw.
      - name: Tests
        run: cargo test --workspace

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Check the binary starts
        if: matrix.native
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN="target/${{ matrix.target }}/release/arca.exe"
            test -f "target/${{ matrix.target }}/release/arca-gui.exe"
          else
            BIN="target/${{ matrix.target }}/release/arca"
            test -f "target/${{ matrix.target }}/release/arca-gui"
          fi
          "$BIN" --version
          "$BIN" --help > /dev/null

      - name: Package
        shell: bash
        run: |
          set -eu
          NAME="arca-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir -p "dist/$NAME"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/arca.exe" "dist/$NAME/"
            cp "target/${{ matrix.target }}/release/arca-gui.exe" "dist/$NAME/"
          else
            cp "target/${{ matrix.target }}/release/arca" "dist/$NAME/"
            cp "target/${{ matrix.target }}/release/arca-gui" "dist/$NAME/"
          fi
          cp README.md LICENSE "dist/$NAME/"
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
            FILE="$NAME.zip"
          else
            tar czf "$NAME.tar.gz" "$NAME"
            FILE="$NAME.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$FILE" > "$FILE.sha256"
          else
            shasum -a 256 "$FILE" > "$FILE.sha256"
          fi
          cat "$FILE.sha256"

      # Only on Windows: a real setup.exe, with its uninstaller in Installed
      # apps. The zip above is just loose binaries and installs no menus.
      - name: Windows installer
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          # arca-shell is excluded from the workspace, so --manifest-path
          # builds it into its own target directory and not the root one.
          # Pointing the installer at the root target is what broke v0.3.0.
          cargo build --release --target ${{ matrix.target }} \
            --manifest-path windows/arca-shell/Cargo.toml
          DLL="windows/arca-shell/target/${{ matrix.target }}/release/arca_shell.dll"
          test -f "$DLL" || { echo "the shell extension is not at $DLL"; exit 1; }
          mkdir -p windows/assets
          # Inno Setup ships with the windows runner image, but not being able
          # to build the installer is not something to discover in a release.
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then
            choco install innosetup -y --no-progress
          fi
          "$ISCC" \
            //DVersion=$VERSION \
            "//DBinDir=..\\target\\${{ matrix.target }}\\release" \
            "//DShellDir=arca-shell\\target\\${{ matrix.target }}\\release" \
            windows/arca.iss
          ls -la dist
          FILE=$(ls dist/arca-setup-*.exe)
          sha256sum "$FILE" | sed 's#dist/##' >> "dist/$(basename "$FILE").sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.sha256
          retention-days: 7

  publish:
    name: Publish the Release
    needs: binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      # If the tag and the workspace version disagree, the Release would go out
      # lying about what it contains.
      - name: The tag must match the workspace version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=$TAG  Cargo.toml=$VERSION"
          test "$TAG" = "$VERSION"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather the files and the checksums
        run: |
          mkdir -p publish
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.exe' \) -exec cp {} publish/ \;
          cat artifacts/*/*.sha256 | sed 's#.*/##' > publish/SHA256SUMS.txt
          ls -la publish
          cat publish/SHA256SUMS.txt

      # With `gh`, which already ships on the runner and uses the workflow's own
      # token: one third-party action fewer in the supply chain of a project
      # that defines itself by not trusting what reaches it.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'END'
          ## Binaries

          Unpack and put `arca` on your PATH. Check the download against
          `SHA256SUMS.txt`:

          ```sh
          sha256sum -c SHA256SUMS.txt --ignore-missing
          ```

          ## Windows

          Use the installer, `arca-setup-*.exe`. It puts Arca in Installed apps
          with its own uninstaller, adds both Explorer context menus, the file
          associations and the PATH entry. The .zip is just the loose binaries
          and integrates with nothing.

          ## Not signed

          These binaries carry no code signature. Windows will show a
          SmartScreen warning and macOS a Gatekeeper one; on macOS clear it
          with `xattr -d com.apple.quarantine arca`. Signing needs a paid
          certificate and is on the pending list.

          The modern Windows 11 menu also needs Developer Mode, because it is
          registered as an unsigned sparse MSIX package. Without it the classic
          menu, under "Show more options", still works.
          END
          gh release create "$GITHUB_REF_NAME" \
            --title "Arca $GITHUB_REF_NAME" \
            --notes-file notes.md \
            publish/*
