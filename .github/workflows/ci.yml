name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  prueba:
    name: Pruebas e interoperabilidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Herramientas de referencia
        run: sudo apt-get update && sudo apt-get install -y zip unzip p7zip-full zstd

      # La interfaz grafica entra en el workspace, asi que este job la compila.
      # eframe necesita estas cabeceras en Linux; en Windows y macOS no hace
      # falta nada porque el sistema ya las trae.
      - name: Dependencias de la interfaz grafica
        run: sudo apt-get install -y libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Compilar sin códecs de C (Rust puro)
        run: cargo build --release --no-default-features
      - run: cargo build --release
      - name: Interoperabilidad verificada por hash
        run: bash interop.sh

      # El instalador se escribio en Windows: esto es lo unico que comprueba
      # que de verdad funciona en Linux, ida y vuelta.
      - name: Instalador, ida y vuelta
        run: |
          ./instalar.sh
          test -x "$HOME/.local/bin/arca" && test -x "$HOME/.local/bin/arca-gui"
          "$HOME/.local/bin/arca" --version
          ./instalar.sh --uninstall
          test ! -e "$HOME/.local/bin/arca" && test ! -e "$HOME/.local/bin/arca-gui"

  windows:
    name: Compilar en Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test --workspace
      - name: Extensión de shell
        working-directory: windows/arca-shell
        run: cargo build --release
        continue-on-error: true

  macos:
    name: Compilar en macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test --workspace
      - name: Instalador, ida y vuelta
        run: |
          ./instalar.sh
          test -x "$HOME/.local/bin/arca" && test -x "$HOME/.local/bin/arca-gui"
          "$HOME/.local/bin/arca" --version
          ./instalar.sh --uninstall
          test ! -e "$HOME/.local/bin/arca" && test ! -e "$HOME/.local/bin/arca-gui"
