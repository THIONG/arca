[workspace]
resolver = "2"
members = [
    "arca-core",
    "arca-zip",
    "arca-tar",
    "arca-cli",
    "arca-gui",
    "arca-icons",
    "arca-drag",
    "arca-net",
]
# Solo compila en Windows: se queda fuera del workspace para que
# `cargo build` siga funcionando en Linux y macOS.
exclude = ["windows/arca-shell"]

[workspace.package]
version = "0.6.6"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["Proyecto Arca"]

[workspace.dependencies]
# Sin `version`, solo `path`. Llevaban "0.1" y al subir el workspace a 0.2.0 se
# quedaron atras: cargo dejo de resolver y CI se cayo en las tres plataformas.
# Un numero que hay que sincronizar a mano es un fallo esperando a ocurrir, y
# aqui no aporta nada porque estos crates no se publican en crates.io. Si algun
# dia se publican, hay que devolver el `version` a los tres.
arca-core = { path = "arca-core" }
arca-zip  = { path = "arca-zip" }
arca-tar  = { path = "arca-tar" }
arca-icons = { path = "arca-icons" }
# DEFLATE: zlib-rs, la implementacion en Rust mas rapida medida (ver diseno S02)
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1"
# Zstandard: bindings a libzstd, con su multihilo interno activado.
zstd = { version = "0.13", features = ["zstdmt"] }
rayon = "1"
clap = { version = "4", features = ["derive"] }

# `cargo run` compila sin optimizar, y eso con GPUI no es "un poco mas lento":
# su motor de layout, el modelador de texto y el rasterizador rehacen su trabajo
# en cada fotograma, y a opt-level 0 eso se ve como tirones al arrastrar y al
# marcar. Nada de esto es codigo de Arca ni se depura nunca, asi que las
# dependencias van optimizadas tambien en depuracion.
[profile.dev.package."*"]
opt-level = 3

# Y el codigo de Arca a 1, que es lo que necesitan el ordenado de la lista y el
# recorrido de las entradas para no notarse. A este nivel el depurador sigue
# parando donde se le dice.
[profile.dev]
opt-level = 1

# Perfil agresivo: requisito R1 (arranque) y R3/R4 (rendimiento)
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Cargo ya fuerza unwind en los perfiles de test y bench, asi que poner
# `panic` aqui no hacia nada salvo un aviso en cada compilacion.
[profile.bench]
inherits = "release"
