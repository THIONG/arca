[package]
name = "arca-drag"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Arrastrar entradas de un archivo hacia el escritorio, en Windows"

# Todo lo de dentro es Windows. En cualquier otra plataforma el crate compila
# y no contiene nada, que es mas simple que excluirlo del workspace.
[target."cfg(windows)".dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-core = "0.58"
