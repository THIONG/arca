[package]
name = "arca-icons"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The icon the system shows for a file type"

# Windows is the only platform with an answer to this that is one call. The
# crate builds everywhere and says "I do not know" on the rest, so the window
# can fall back to its own drawings without caring where it is running.
[target."cfg(windows)".dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
