[package]
name = "arca-gpui-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace]

# G1 is deliberately outside Arca's workspace: it must not touch the
# production egui window or make GPUI a transitive dependency of arca-gui.
[features]
platform-probes = ["dep:rfd", "dep:clipboard-win", "dep:arca-drag"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "3384317a9931a21bb5ad8706f0f9d82cb02a71ec", package = "gpui", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "3384317a9931a21bb5ad8706f0f9d82cb02a71ec", package = "gpui_platform" }
rfd = { version = "0.15", optional = true }
clipboard-win = { version = "5", optional = true }
arca-drag = { path = "../../arca-drag", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "3384317a9931a21bb5ad8706f0f9d82cb02a71ec", package = "gpui_platform", features = ["wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "3384317a9931a21bb5ad8706f0f9d82cb02a71ec", package = "gpui_platform", features = ["font-kit"] }

[[bin]]
name = "arca-gpui-spike"
path = "src/main.rs"
